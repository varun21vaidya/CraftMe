<!DOCTYPE html>
<html>
<head>
  <title>Order Confirmation</title>
</head>
<body>
  <h1>Thanks for your order, {{name}}!</h1>
  <p>Order ID: {{order_id}}</p>
  <table>
    {{#each items}}
    <tr>
      <td>{{title}} x{{quantity}}</td>
      <td>${{price}}</td>
    </tr>
    {{/each}}
  </table>
  <p>Total: ${{total}}</p>
</body>
</html>
